# Dependency policy checked in CI (`cargo deny check`): known vulnerabilities,
# allowed licenses and trusted sources.

[graph]
all-features = true

[advisories]
# Unmaintained or yanked crates in the dependency tree fail the check; add an
# entry to `ignore` with the advisory ID and a reason only after review.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
