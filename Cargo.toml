[package]
name = "ecliven-code"
version = "0.4.1"
edition = "2021"
description = "Terminal-first AI coding agent built in Rust"
authors = ["Ecliven Code Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ikiresearch/ecliven-code"
homepage = "https://ecliven.com/code"
readme = "README.md"
keywords = ["ai", "agent", "cli", "tui", "coding-assistant"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ecliven"
path = "src/main.rs"

[dependencies]
tempfile = "3.13"
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "5.0"
dotenvy = "0.15"
futures = "0.3"
globset = "0.4"
ratatui = "0.29"
regex = "1.11"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
serde_json = "1.0"
similar = "2.6"
thiserror = "2.0"
tokio = { version = "1.41", features = ["full"] }
toml = "1.2"
walkdir = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
