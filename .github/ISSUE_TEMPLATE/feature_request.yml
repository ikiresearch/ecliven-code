name: Propuesta de funcionalidad
description: Sugiere una mejora o una capacidad nueva.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Qué necesitas hacer y por qué hoy no se puede o cuesta.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
      description: Cómo debería funcionar (comandos, configuración, comportamiento).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: textarea
    id: security
    attributes:
      label: Impacto en seguridad
      description: ¿Ejecuta comandos, escribe archivos, usa red o credenciales?
